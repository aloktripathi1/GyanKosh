databases:
  - name: gyankosh-db
    plan: free
    databaseName: gyankosh
    user: gyankosh

services:
  - type: web
    name: gyankosh-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: gyankosh-db
          property: connectionString
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: API_KEY
        sync: false
      - key: STORAGE_BACKEND
        value: local
      - key: LOCAL_STORAGE_PATH
        value: /app/storage_data
      - key: CORS_ALLOWED_ORIGINS
        sync: false # set to the deployed frontend's URL, e.g. https://gyankosh-frontend.onrender.com
    # No preDeployCommand: that's a paid-tier-only Render feature. Migrations
    # instead run from docker-entrypoint.sh on every container start.
    #
    # No separate worker service, no Redis: Render's Background Worker type
    # has no free tier (Starter is $7/mo minimum), and Redis's only job was
    # feeding that worker via Celery. The pipeline now runs as a FastAPI
    # BackgroundTask in this same web service instead — same orchestrator,
    # same checkpoint/resume logic, just triggered in-process rather than via
    # a message queue. See app/tasks/pipeline_tasks.py.

  - type: web
    name: gyankosh-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        sync: false # set to the deployed backend's URL, e.g. https://gyankosh-u3b8.onrender.com
    routes:
      # SPA fallback: React Router handles /jobs/:id, /tkp/:id etc. client-side,
      # so every path must serve index.html rather than 404ing on direct load
      # or refresh.
      - type: rewrite
        source: /*
        destination: /index.html
